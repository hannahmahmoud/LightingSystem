# Server config
server:
  error:
    include-message: always
    include-binding-errors: always

# Database Configuration
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/lightingsystem
    username: root
    password: mysqlpassword

  security:
    user:
      name: admin
      password: admin123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect


mqtt:
  broker: tcp://broker.hivemq.com:8080
  clientId: backend-lighting-system
  topic:
    led1: home/led/led1
    led2: home/led/led2
    pir1: home/sensor/pir1
    pir2: home/sensor/pir2
